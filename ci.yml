name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install lupa pytest requests luacheck
      - name: luacheck (informacyjnie)
        continue-on-error: true
        run: luacheck TsmAnalize --config .luacheckrc
      - name: Smoke test addonu
        run: python tests/run_tests.py TsmAnalize
      - name: Testy silnika
        run: pytest tests
